# BuildTelemetry on Kubernetes (stateless API replicas + managed PostgreSQL).
#
#   kubectl create namespace build-telemetry
#   kubectl -n build-telemetry create secret generic build-telemetry \
#     --from-literal=postgres='Host=<pg-host>;Database=buildtelemetry;Username=<user>;Password=<pw>;SSL Mode=Require' \
#     --from-literal=ingest-key='<random>' \
#     --from-literal=oidc-client-secret='<secret-or-empty>' \
#     --from-literal=admin-password='<at-least-12-characters-or-empty>'
#   kubectl -n build-telemetry apply -f build-telemetry.yaml
#
# Replace the host names and (optionally) the OIDC settings below. The image is the one CI
# publishes (linux/amd64 + linux/arm64); pin a release tag such as :1.2.1 or a :sha-<commit>
# tag instead of :latest for reproducible rollouts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-telemetry
  labels: { app.kubernetes.io/name: build-telemetry }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: build-telemetry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: build-telemetry }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/julianoberhaensli/cmake-build-telemetry:latest
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: ConnectionStrings__Postgres
              valueFrom: { secretKeyRef: { name: build-telemetry, key: postgres } }
            - name: Telemetry__Ingest__ApiKeys__default
              valueFrom: { secretKeyRef: { name: build-telemetry, key: ingest-key } }
            - { name: Telemetry__Ingest__AllowAnonymous, value: "false" }
            - { name: Telemetry__PublicUrl, value: "https://build-telemetry.example.com" }
            - { name: Telemetry__TrustAllProxies, value: "true" }
            - { name: Telemetry__Retention__Days, value: "180" }
            - { name: Telemetry__Auth__Mode, value: "None" }   # Oidc for SSO
            - { name: Telemetry__Auth__Authority, value: "" }
            - { name: Telemetry__Auth__ClientId, value: "" }
            - name: Telemetry__Auth__ClientSecret
              valueFrom: { secretKeyRef: { name: build-telemetry, key: oidc-client-secret, optional: true } }
            # admin page: password (secret key "admin-password") and/or an OIDC role
            - name: Telemetry__Admin__Password
              valueFrom: { secretKeyRef: { name: build-telemetry, key: admin-password, optional: true } }
            - { name: Telemetry__Admin__Role, value: "" }
            # With Oidc and >1 replica, mount a shared (RWX) volume here or use sticky sessions:
            - { name: Telemetry__DataProtectionKeysPath, value: "/keys" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "" }
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: keys, mountPath: /keys }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: keys, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: build-telemetry
spec:
  selector: { app.kubernetes.io/name: build-telemetry }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: build-telemetry
  annotations:
    # bundles of very large builds can exceed the default body size
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  rules:
    - host: build-telemetry.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: build-telemetry, port: { name: http } } }
  tls:
    - hosts: [build-telemetry.example.com]
      secretName: build-telemetry-tls
