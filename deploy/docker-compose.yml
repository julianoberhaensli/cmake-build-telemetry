# BuildTelemetry - single-host deployment (PostgreSQL + API/dashboard).
#
# Uses the published image; no source checkout needed:
#
#   mkdir build-telemetry && cd build-telemetry
#   curl -fsSLO https://raw.githubusercontent.com/julianoberhaensli/cmake-build-telemetry/main/deploy/docker-compose.yml
#   curl -fsSL -o .env https://raw.githubusercontent.com/julianoberhaensli/cmake-build-telemetry/main/deploy/.env.example
#   # edit .env: set POSTGRES_PASSWORD and INGEST_API_KEY
#   docker compose up -d          # -> http://localhost:8080
#
# Demo data instead of real builds:  DEMO_DATA=true docker compose up -d
# Update to the newest image:        docker compose pull && docker compose up -d
# Build the image from source:       see docker-compose.build.yml
name: build-telemetry

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: buildtelemetry
      POSTGRES_USER: buildtelemetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildtelemetry -d buildtelemetry"]
      interval: 5s
      timeout: 3s
      retries: 30
    # not published: only the app talks to the database

  app:
    # pin a release in production, e.g. ...cmake-build-telemetry:1.2.1 (set BT_IMAGE in .env)
    image: ${BT_IMAGE:-ghcr.io/julianoberhaensli/cmake-build-telemetry:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      ConnectionStrings__Postgres: "Host=db;Database=buildtelemetry;Username=buildtelemetry;Password=${POSTGRES_PASSWORD}"
      Telemetry__PublicUrl: ${PUBLIC_URL:-http://localhost:8080}
      Telemetry__TrustAllProxies: "true"
      # ingest API keys: one or more named keys (Telemetry__Ingest__ApiKeys__<name>)
      Telemetry__Ingest__ApiKeys__default: ${INGEST_API_KEY:?Set INGEST_API_KEY in .env}
      Telemetry__Ingest__AllowAnonymous: "false"
      Telemetry__Ingest__StoreCommands: ${STORE_COMMANDS:-true}
      Telemetry__Retention__Days: ${RETENTION_DAYS:-180}
      Telemetry__Retention__CommandDays: ${RETENTION_COMMAND_DAYS:-30}
      Telemetry__Demo__Seed: ${DEMO_DATA:-false}
      # dashboard single sign-on (None | Oidc)
      Telemetry__Auth__Mode: ${AUTH_MODE:-None}
      Telemetry__Auth__Authority: ${OIDC_AUTHORITY:-}
      Telemetry__Auth__ClientId: ${OIDC_CLIENT_ID:-}
      Telemetry__Auth__ClientSecret: ${OIDC_CLIENT_SECRET:-}
      Telemetry__Auth__RequiredRole: ${OIDC_REQUIRED_ROLE:-}
      # administration (delete builds/machines, legend groups); empty = disabled
      Telemetry__Admin__Password: ${ADMIN_PASSWORD:-}
      Telemetry__Admin__Role: ${OIDC_ADMIN_ROLE:-}
      Telemetry__DataProtectionKeysPath: /keys
      # optional OpenTelemetry export (traces + metrics)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - keys:/keys

volumes:
  pgdata:
  keys:
